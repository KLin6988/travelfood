<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>opendata-地方美食餐廳列表</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/Myallcss.css">
    <style>
        @media screen and (max-width: 768px){
            .table-rwd thead{
                display: none;
            }

            .table-rwd tbody tr{
                display: block;
                border: 2px solid#53191e;
                margin-top: 15px;
            }
            .table-rwd tbody tr td{
                display: block;
                overflow: hidden;
            }
            .table-rwd tbody tr td::before{
                content: attr(data-th) " : ";
                font-style: 20px;
                font-weight: 900;
                display: block;
                float: left;
                width: 30%;
                text-align: right;
                padding-right: 15px;
                color: #220909;
            }
            .table-rwd tbody tr td span{
                display: block;
                float: left;
                width: 70%;
            }            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="display-2 fw-900 text-center my-4">地方美食餐廳列表</div>
        <table class="table table-bordered table-rwd">
        <thead class="table-dark" >
            <tr>
                <th width="10%">餐廳名稱</th>
                <th width="25%">餐廳圖片</th>
                <th width="20%">餐廳地址</th>
                <th width="10%">餐廳電話</th>
                <th width="10%">餐廳信箱</th>
                <th width="25%">餐廳簡介</th>
            </tr>
        </thead>
        <tbody>
        
            <tbody id="mytbody">
                    
            <tr>
                <td data-th="餐廳名稱"><span>xxx</span></td>
                <td data-th="餐廳圖片"><span><img src="Images/landscape01.avif" class="img-fluid" alt=""></span></td>
                <td data-th="餐廳地址"><span>xxx</span></td>
                <td data-th="餐廳電話"><span>XXX </span></td>
                <td data-th="餐廳信箱"><span>xxx</span></td>
                <td data-th="餐廳簡介"><span class="text-truncate" style="max-width: 450px; display: block;">人氣在於公主最好的咖啡，一顆對象藝術裡面培訓版權所有不明白缺乏，提醒無關到來改變醫學以來我對結束，測試包裝存在發行儘快，無論文明私服傳說範圍內貸款朋友順利強烈你能，更大利益之一一體更多元素，公共再次日前秘密預期案例對待放心包括包裝部隊再說證券鈴聲下載，這。</span></td>
            
            <tr>
              </tbody>
              </table>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        //主程式：開始必定執行的地方
        $(function(){
            //抓取外部資料 - 農村地方美食小吃特色料
            $.ajax({
            type: "GET", 
            url: 
            "https://data.moa.gov.tw/open_search.aspx?id=193"
            dataType:"json",
            success: showdata, 
            error: function(){
                console.log("抓取外部資料 - 農村地方美食小吃特色料理-失敗！")
            }
        });
        });
        //自訂函式 副程式
        function showdata(data){
            console.log(data);
            //$("#mytbody").empty();
            data.forEach(function(item){
                console.log(item.Name);
            }
        )
            const strHTML = `<tr>
                                <td data-th="餐廳名稱"><span>${item.Name}</span></td>
                                <td data-th="餐廳圖片"><span><img src="${item.PicURL} class="img-fluid" alt=""> 
                                     </span></td>
                                <td data-th="餐廳地址"><span>${item.Address}</span></td>
                                <td data-th="餐廳電話"><span>${item.Tel}<</span></td>
                                <td data-th="餐廳信箱"><span>${item.Email}</span></td>
                                <td data-th="餐廳簡介"><span>${item.FoodFeature}</span></td>
                            </tr>';'
            
            $("#mytbody").append(strHTML);
        }
    </script>
</body>
</html>
